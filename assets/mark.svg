<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- One road crossing one border: the two things this atlas is made of, and
       the border is what makes it North American rather than American. The
       carriageway is filled faintly so the silhouette still reads at favicon
       size, where an outline alone turns to mush, and the centre line is three
       explicit strokes rather than a dash pattern for the same reason. -->
  <path d="M3.8 22 L10.1 5.4 H13.9 L20.2 22 Z"
        fill="rgba(53,231,255,0.16)" stroke="#35e7ff" stroke-width="1.5"/>
  <path d="M12 7.6v2.1M12 12.1v2.7M12 17.1v3.4" stroke="#35e7ff" stroke-width="2.1"/>
  <path d="M1.6 11.4h20.8" stroke="#8fa3bd" stroke-width="1"
        stroke-dasharray="2.8 2.4" opacity="0.8"/>
</svg>
