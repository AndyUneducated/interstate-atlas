        fill="rgba(53,231,255,0.14)" stroke="#35e7ff" stroke-width="1.5"/>
  <path d="M12 16.8V7.2" stroke="#35e7ff" stroke-width="1.6" stroke-dasharray="2.6 2.4" opacity="0.95"/>
</svg>
