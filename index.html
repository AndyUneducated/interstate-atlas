<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Highway Atlas — the highway network of North America</title>
<meta name="description" content="An interactive atlas of the North American highway network: the Interstates, the US numbered routes and every state route system, with the Trans-Canada Highway, Canada's National Highway System and every numbered provincial route. Route termini, roadway classification, elevation profiles and written profiles, in English and Chinese.">

<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<!-- MapLibre is vendored rather than loaded from a CDN: the site is otherwise
     entirely self-contained, and a static atlas should not stop working because
     someone else's origin is having a bad day. -->
<link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
<link rel="stylesheet" href="assets/styles.css">
<!-- Before the stylesheet paints, so a reader who chose the light panels does
     not see the dark ones flash first. -->
<script>
  try { if (localStorage.getItem('ia.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
</script>
</head>
<body class="is-booting">

<div id="map"></div>
<div id="veil"></div>

<!-- ── boot ─────────────────────────────────────────────────────────────── -->
<div id="boot">
  <div class="boot-in">
    <svg class="boot-mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring" cx="50" cy="50" r="42"/>
      <path class="arc" d="M50 8 a42 42 0 0 1 36 21"/>
      <!-- The same road and border as the header mark, scaled to sit inside
           the ring. Here the centre line is one continuous stroke so it can
           dash itself in while the data loads; at this size a dashed stroke
           renders cleanly, which is exactly what it cannot do at 21px. -->
      <g transform="translate(50 50) scale(2.7) translate(-12 -13.7)">
        <path class="bm-road" d="M3.8 22 L10.1 5.4 H13.9 L20.2 22 Z"/>
        <path class="bm-lane" d="M12 7.6V20.5"/>
        <path class="bm-edge" d="M1.6 11.4h20.8"/>
      </g>
    </svg>
    <p class="boot-title" id="bootTitle">HIGHWAY ATLAS</p>
    <p class="boot-sub" id="bootSub">assembling the road network</p>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <p class="boot-step" id="bootStep"></p>
  </div>
</div>

<!-- ── top bar ──────────────────────────────────────────────────────────── -->
<header id="hud">
  <div class="brand">
    <!-- One road crossing one border. The mark used to be a US highway
         escutcheon, which said "United States" on a product whose own tagline
         claims North America; the dashed rule is the cartographic convention
         for an international boundary, and it is the border that makes the
         road a continental one. The centre line is three explicit strokes
         rather than a dasharray, because a dasharray on a stroke this short
         renders as a smudge at favicon size. -->
    <svg viewBox="0 0 24 24" aria-hidden="true" class="brand-mark">
      <path class="bm-road" d="M3.8 22 L10.1 5.4 H13.9 L20.2 22 Z"/>
      <path class="bm-lane" d="M12 7.6v2.1M12 12.1v2.7M12 17.1v3.4"/>
      <path class="bm-edge" d="M1.6 11.4h20.8"/>
    </svg>
    <span class="brand-txt">
      <span class="brand-name" data-i18n="app.name">HIGHWAY ATLAS</span>
      <span class="brand-sub" data-i18n="app.tagline">the highway network of North America</span>
      <!-- The narrow layout used to hide the tagline outright, which left the
           brand claiming less than the atlas covers. It shortens instead. -->
      <span class="brand-sub brand-sub-s" data-i18n="app.taglineShort">North America</span>
    </span>
  </div>

  <!-- The atlas covers two separate parts of the world, and a pan across the
       Pacific is not a way to get from one to the other. This follows the
       view as well as setting it, so it always says which one is on screen. -->
  <div class="seg rseg" id="regionSeg" role="group" aria-label="Region">
    <button class="seg-b" type="button" data-region="na" data-i18n="region.na">North America</button>
    <button class="seg-b" type="button" data-region="ea" data-i18n="region.ea">East Asia</button>
  </div>

  <div class="hud-sp"></div>

  <!-- Three menus, split by what they change. Layers is the map itself: the
       ground and what is drawn on it. Settings is how the interface reads.
       More is every page that explains the atlas. Search is the panel on the
       left, with the command palette on / and Ctrl-K. -->
  <nav class="hud-group" aria-label="Views">
    <div class="menu" id="menuLayers">
      <button class="btn btn-ico" id="btnLayers" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-tip="nav.layers" data-key="L">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      </button>
      <div class="menu-pop menu-pop-r menu-lay" role="group">
        <p class="menu-hd" data-i18n="nav.basemap">Base map</p>
        <!-- Each ground is shown rather than named, so the choice is made by
             looking. The previews are the map itself, shot by shoot-bases.mjs. -->
        <div class="bcards" id="basemap" role="group" aria-label="Base map">
          <button class="bcard on" data-base="dark" type="button">
            <img src="assets/base-dark.jpg" alt="" width="96" height="60" loading="lazy">
            <span data-i18n="base.darkShort">Dark</span>
          </button>
          <button class="bcard" data-base="relief" type="button">
            <img src="assets/base-relief.jpg" alt="" width="96" height="60" loading="lazy">
            <span data-i18n="base.reliefShort">Relief</span>
          </button>
          <button class="bcard" data-base="satellite" type="button">
            <img src="assets/base-satellite.jpg" alt="" width="96" height="60" loading="lazy">
            <span data-i18n="base.satelliteShort">Satellite</span>
          </button>
        </div>
        <p class="menu-hd" data-i18n="nav.overlays">On the map</p>
        <div class="otiles">
          <button class="otile menu-tg" id="btnCrossings" type="button" aria-pressed="false" style="--c: #ff4d6d" data-i18n-title="base.crossings">
            <svg viewBox="0 0 24 24"><path d="M12 2v20" stroke-dasharray="2.5 2.5"/><path d="M3 9h18"/><path d="M3 15h18"/><circle cx="12" cy="12" r="2.6"/></svg>
            <b data-i18n="base.crossingsShort">Crossings</b><small data-count="crossings"></small>
          </button>
          <button class="otile menu-tg" id="btnTolls" type="button" aria-pressed="false" style="--c: #ffd166" data-i18n-title="base.tolls">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.2c-.5-.9-1.5-1.4-2.6-1.4-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.1 0-2.1-.5-2.6-1.4M12 6.2v1.6M12 16.2v1.6"/></svg>
            <b data-i18n="base.tollsShort">Tolls</b><small data-count="tolls"></small>
          </button>
          <button class="otile menu-tg" id="btnBridges" type="button" aria-pressed="false" style="--c: #9be15d" data-i18n-title="base.bridges">
            <svg viewBox="0 0 24 24"><path d="M2 9h20M2 16h20"/><path d="M4 16c0-4 3.6-7 8-7s8 3 8 7"/><path d="M7 11.2V16M12 9v7M17 11.2V16"/></svg>
            <b data-i18n="base.bridges">Bridges</b><small data-count="bridges"></small>
          </button>
        </div>
        <div class="menu-sep"></div>
        <button class="menu-it menu-tg" id="btnTerrain" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M3 16l9-5 9 5-9 5z"/><path d="M12 11V4"/><path d="M9 6.5L12 4l3 2.5"/></svg>
          <span class="menu-txt"><b data-i18n="base.tilt">3D tilt</b><small data-i18n="base.tiltSub">terrain, seen from an angle</small></span><kbd>T</kbd><i class="sw"></i>
        </button>
      </div>
    </div>

    <!-- How the interface reads rather than what the map shows: units,
         language, the panels' own colour, the colour key, and the interface
         itself. -->
    <div class="menu" id="menuSettings">
      <button class="btn btn-ico" id="btnSettings" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-tip="nav.settings" data-key="S">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <div class="menu-pop menu-pop-r menu-set" role="group">
        <p class="menu-hd" data-i18n="set.units">Units</p>
        <div class="seg seg-wide seg-txt" id="unitSeg" role="group">
          <button class="seg-b" data-u="imperial" type="button"><b>mi</b><small>mph · ft</small></button>
          <button class="seg-b" data-u="metric" type="button"><b>km</b><small>km/h · m</small></button>
        </div>
        <p class="menu-hd" data-i18n="set.lang">Language</p>
        <div class="seg seg-wide seg-txt" id="langSeg" role="group">
          <button class="seg-b" data-lang="en" type="button"><b>English</b></button>
          <button class="seg-b" data-lang="zh" type="button"><b>中文</b></button>
        </div>
        <p class="menu-hd" data-i18n="set.theme">Panels</p>
        <div class="seg seg-wide" id="themeSeg" role="group">
          <button class="seg-b" data-theme="dark" type="button">
            <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            <span data-i18n="set.themeDark">Dark</span>
          </button>
          <button class="seg-b" data-theme="light" type="button">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
            <span data-i18n="set.themeLight">Light</span>
          </button>
        </div>
        <div class="menu-sep"></div>
        <button class="menu-it menu-tg on" id="btnLegend" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M4 6h3M4 12h3M4 18h3"/><path d="M10 6h10M10 12h10M10 18h7"/></svg>
          <span class="menu-txt"><b data-i18n="base.legend">Colour key</b><small data-i18n="base.legendSub">which line colour is which system</small></span><i class="sw"></i>
        </button>
        <!-- Everything here is in front of the map, and sometimes the map is
             what you want. -->
        <button class="menu-it" id="btnZen" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
          <span class="menu-txt"><b data-i18n="nav.zen">Hide the interface</b><small data-i18n="set.zenSub">just the map; Esc brings it back</small></span><kbd>Z</kbd>
        </button>
      </div>
    </div>

    <div class="menu" id="menuMore">
      <button class="btn btn-ico" id="btnMore" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-tip="nav.more" data-key="M">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
      </button>
      <!-- Explore first, the explanation of the atlas below it. -->
      <div class="menu-pop menu-pop-r menu-grid" role="menu">
        <button class="menu-it gcard" id="btnDash" type="button" role="menuitem" style="--c: #35e7ff">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <b data-i18n="nav.dashboard">Statistics</b><small data-i18n="nav.dashboardSub">the network in numbers and rankings</small>
        </button>
        <button class="menu-it gcard" id="btnNumbering" type="button" role="menuitem" style="--c: #ffd166">
          <svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3v18M16 3v18"/></svg>
          <b data-i18n="nav.numbering">Numbering</b><small data-i18n="nav.numberingSub">why the numbers fall where they do</small>
        </button>
        <button class="menu-it gcard" id="btnTimeline" type="button" role="menuitem" style="--c: #9be15d">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          <b data-i18n="nav.timeline">Timeline</b><small data-i18n="nav.timelineSub">watch the network being built</small>
        </button>
        <button class="menu-it gcard" id="btnPalette" type="button" role="menuitem" style="--c: #c39bff">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
          <b data-i18n="nav.palette">Jump to</b><small data-i18n="nav.paletteSub">any route, place or view</small><kbd>/</kbd>
        </button>
        <button class="menu-it gcard" id="btnDocs" type="button" role="menuitem" style="--c: #ff9f68">
          <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>
          <b data-i18n="nav.docs">Data &amp; sources</b><small data-i18n="nav.docsSub">sources, coverage, decisions, known gaps</small>
        </button>
        <button class="menu-it gcard" id="btnAbout" type="button" role="menuitem" style="--c: #8fb4ff">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg>
          <b data-i18n="nav.about">About</b><small data-i18n="nav.aboutSub">what the atlas draws, keyboard shortcuts</small>
        </button>
      </div>
    </div>
  </nav>
</header>

<!-- ── left shell ───────────────────────────────────────────────────────────
     Finding a road comes first, because it is what almost everyone opens this
     to do. The systems below it decide what is drawn, which is a thing you
     adjust once and then leave alone. -->
<div id="shell">
  <section class="card card-find">
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search routes">
      <button class="btn btn-ico clr" id="qClear" type="button" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="btn btn-ico fold" id="btnCollapse" type="button" title="Hide panel" aria-label="Hide panel">
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="1.7"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <div class="card-hd" style="border-top:0">
      <h2 id="resTitle" data-i18n="search.results">Results</h2>
      <span class="sp"></span>
      <span class="sys-count" id="resCount"></span>
    </div>
    <!-- The right-hand column was a bare number against every row, and the
         order of an unsearched list was not stated anywhere. Both are said
         once, here, rather than repeated down the list. -->
    <div class="res-cols">
      <span id="resSort"></span>
      <span class="res-cols-mi" id="resColMi">Miles</span>
    </div>
    <div class="results" id="results"></div>
  </section>

  <section class="card card-sys" aria-labelledby="sysTitle">
    <div class="card-hd">
      <h2 id="sysTitle" data-i18n="sys.title">Route systems</h2>
    </div>
    <div class="sys-list" id="sysList"></div>
    <!-- Alaska, Hawaii and Puerto Rico are all in the data and all off the
         edge of the opening view, which made them look absent. -->
    <div class="jumps" id="jumps"></div>
  </section>
</div>

<!-- Lives outside #shell on purpose: the collapse control is inside the panel
     and goes with it, so the way back has to be somewhere the panel cannot
     take with it. -->
<button id="shellOpen" type="button" title="Show route panel" aria-label="Show route panel">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  <span class="so-txt" data-i18n="nav.findRoute">Find a route</span>
</button>

<!-- The key to the line colours, switched from the Layers menu. -->
<div id="legend" aria-hidden="true"></div>

<!-- The way out of a hidden interface has to be part of the hidden interface's
     replacement, or the only way back is a reload. -->
<button id="zenOut" type="button" data-i18n-title="nav.zenOut" title="Show the interface">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5V9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
  <span data-i18n="nav.zenOut">Show the interface</span>
  <kbd>Z</kbd>
</button>

<!-- ── route detail ─────────────────────────────────────────────────────── -->
<aside id="detail" class="hidden" aria-live="polite"></aside>

<!-- ── flythrough ───────────────────────────────────────────────────────── -->
<div id="fly"></div>

<!-- ── buildout timelapse ───────────────────────────────────────────────────
     Docked rather than modal. The point of this control is to watch the map
     change, so it cannot be allowed to cover the map. -->
<div id="tlapse"></div>

<!-- ── command palette ──────────────────────────────────────────────────── -->
<div id="palette" class="hidden" role="dialog" aria-modal="true">
  <div class="pal">
    <div class="pal-in">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
      <input id="palQ" type="text" autocomplete="off" spellcheck="false" aria-label="Command palette">
    </div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-ft">
      <span><b>↑ ↓</b> <span data-i18n="pal.nav">navigate</span></span>
      <span><b>↵</b> <span data-i18n="pal.open">open</span></span>
      <span><b>esc</b> <span data-i18n="pal.close">dismiss</span></span>
    </div>
  </div>
</div>

<!-- ── overlay sheet ────────────────────────────────────────────────────── -->
<div id="sheet" class="hidden" role="dialog" aria-modal="true"><div class="sh" id="sheetInner"></div></div>

<div id="toast"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span id="toastMsg"></span></div>

<script src="assets/vendor/maplibre-gl.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
